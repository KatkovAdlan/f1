name: Build NeoForge mod

on:
  push:
    branches:
      - gui-redesign
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: gradle

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: xtoxray-neoforge-1.21.1
          path: build/libs/*.jar
